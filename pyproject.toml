[project]
name = "hwgenie"
version = "0.65.0"
description = "Generate handout/submission/solutions files from a single LaTeX homework source"
requires-python = ">=3.9"
dependencies = ["pylatexenc>=2.10,<3", "pypdf>=4", "quickjs>=1.19"]

[project.scripts]
hwgenie = "hwgenie.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# KaTeX for the pre-rendered (offline) student feedback pages
[tool.setuptools.package-data]
hwgenie = ["katex/*.js", "katex/*.css", "katex/LICENSE", "katex/fonts/*.woff2"]
